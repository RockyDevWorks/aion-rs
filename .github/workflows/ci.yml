name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned recent stable toolchain used by the fmt/clippy/doc/semver jobs.
  # Bump this as new Rust releases land (Dependabot does not manage it).
  RUST_STABLE: "1.99.1"
  # Minimum required line coverage, in percent, enforced by the coverage job.
  # Bump this as coverage improves; never lower it without discussion.
  COVERAGE_MIN: "95"

jobs:
  # ---------------------------------------------------------------------------
  # Formatting — fast fail on style before anything expensive runs.
  # ---------------------------------------------------------------------------
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.RUST_STABLE }} (with rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # Clippy — lints as errors.
  # ---------------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.RUST_STABLE }} (with clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------------
  # Build + test across platforms and a pinned MSRV.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Pinned recent stable toolchain.
        toolchain: ["1.99.1"]
        include:
          # Pin an MSRV check on Linux only.
          - os: ubuntu-latest
            toolchain: "1.85.0"
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - name: cargo build
        run: cargo build --all-targets --verbose
      - name: cargo test
        run: cargo test --all-targets --verbose
      - name: cargo test (doc)
        run: cargo test --doc --verbose

  # ---------------------------------------------------------------------------
  # Code coverage — gated at a minimum TOTAL line coverage threshold.
  #
  # Runs the whole test suite under instrumentation with cargo-llvm-cov and
  # fails the job if total line coverage drops below COVERAGE_MIN. Runs on
  # Linux, where the CLI integration tests (tests/cli.rs) execute normally.
  #
  # Note: tests/cli.rs drives the `aion` binary as a child process. Child-
  # process execution is not merged into the instrumented harness's coverage,
  # so src/main.rs reads lower on its own; the gate is enforced on the project
  # total, which the library + integration tests keep above the threshold.
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage (>=${{ env.COVERAGE_MIN }}%)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Allows codecov/codecov-action to use OIDC for tokenless uploads when
      # CODECOV_TOKEN is not configured (e.g. public repos).
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.RUST_STABLE }} (with llvm-tools)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report (LCOV)
        # Produce the report first, without the gate, so the LCOV file exists
        # even when coverage is below threshold — we still want it on Codecov
        # and as an artifact in that case.
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info
      - name: Coverage summary
        if: always()
        run: cargo llvm-cov report --summary-only
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          # Fail the step if the upload itself errors, so a broken integration
          # is visible rather than silently green.
          fail_ci_if_error: true
          # Project slug lets the action resolve the repo even on forks.
          slug: ${{ github.repository }}
        env:
          # Set this repository secret in GitHub → Settings → Secrets and
          # variables → Actions. Required for private repos and for reliable
          # uploads on pull requests from forks; harmless if the repo is public.
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage report (LCOV) as a build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore
      - name: Enforce minimum total coverage
        # Run the gate last so that the summary, the Codecov upload, and the
        # artifact all happen first; this step is the one that fails the job
        # when total line coverage drops below COVERAGE_MIN.
        run: cargo llvm-cov report --fail-under-lines ${{ env.COVERAGE_MIN }}

  # ---------------------------------------------------------------------------
  # Documentation must build without warnings.
  # ---------------------------------------------------------------------------
  docs:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.RUST_STABLE }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ---------------------------------------------------------------------------
  # Semantic versioning — flags breaking API changes in the library crate.
  # Runs only on pull requests, where a baseline comparison is meaningful.
  #
  # cargo-semver-checks diffs the current API against the crate's last release
  # on crates.io. Until `aion-validator` is published there is no baseline and
  # the tool exits non-zero ("not found in registry"). We therefore first probe
  # crates.io and skip the check (green) while the crate is unpublished; once it
  # is published the real check runs automatically.
  # ---------------------------------------------------------------------------
  semver:
    name: semver-checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.RUST_STABLE }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_STABLE }}
      - uses: Swatinem/rust-cache@v2
      - name: Check whether the crate is published
        id: published
        run: |
          name="aion-validator"
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/${name}")
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::'${name}' is not published on crates.io (HTTP ${code}); skipping semver-checks until a baseline exists."
          fi
      - name: cargo-semver-checks
        if: steps.published.outputs.published == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
