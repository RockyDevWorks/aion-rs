[package]
name = "aion"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
description = "Structural validator for the AION v0.0.1-1 language-definition format"
license = "MIT OR Apache-2.0"

[[bin]]
name = "aion"
path = "src/main.rs"

[dependencies]
pest = "2.8"
pest_derive = "2.8"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]

[profile.release]
opt-level = 2
